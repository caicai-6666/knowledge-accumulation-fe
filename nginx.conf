# 官方镜像启动时仅替换 BACKEND_UPSTREAM，保留 Nginx 自身变量。
map $http_x_forwarded_proto $knowledge_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    # 单轮 PDF 合计 20 MiB，额外预留 multipart 和问题字段空间。
    client_max_body_size 22m;

    # 容器重建后重新解析服务地址，不绑定旧容器 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knowledge_backend "${BACKEND_UPSTREAM}";

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
    location = / { return 302 /knowledge-accumulation/; }
    location = /knowledge-accumulation { return 308 /knowledge-accumulation/; }
    location = /knowledge-accumulation/api { return 404; }
    location = /knowledge-accumulation/__auth { return 404; }
    location ^~ /knowledge-accumulation/__auth/ { return 404; }

    # API 保留路径和鉴权头；不回退 SPA，不缓存或重试任务注册。
    location ^~ /knowledge-accumulation/api/ {
        proxy_pass http://$knowledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $knowledge_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # 子平台由外层网关按最长路径路由，不能落入统一入口的 SPA 回退。
    location = /knowledge-accumulation/registry { return 404; }
    location ^~ /knowledge-accumulation/registry/ { return 404; }
    location = /knowledge-accumulation/contract { return 404; }
    location ^~ /knowledge-accumulation/contract/ { return 404; }

    # Vite 输出文件名含内容哈希：包括图标、字体、JS/CSS 及内嵌的小图标。
    location ^~ /knowledge-accumulation/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 缓存管理脚本每次校验更新，不能被长期静态缓存锁住。
    location = /knowledge-accumulation/icon-cache-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 若后续加入无哈希公共图标，使用短于哈希资源的缓存周期。
    location ~* ^/knowledge-accumulation/[^/]+\.(?:ico|svg|png|jpe?g|webp|gif|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # 缺失静态文件返回 404，不能返回 HTML 导致脚本 MIME 错误。
    location ~ ^/knowledge-accumulation/.*\.[^/]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /knowledge-accumulation/ {
        try_files $uri $uri/ /knowledge-accumulation/index.html;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
